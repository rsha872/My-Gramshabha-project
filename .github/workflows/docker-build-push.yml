name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/machhmarwa-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/machhmarwa-backend:latest

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/machhmarwa-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/machhmarwa-frontend:latest
