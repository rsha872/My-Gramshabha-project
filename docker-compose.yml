services:

  postgres:
    image: postgres:16-alpine
    container_name: machhmarwa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: machhmarwa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"


  backend:
    build: ./backend
    container_name: machhmarwa-backend
    restart: unless-stopped

    environment:
      PORT: 5000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: machhmarwa_db
      PGUSER: postgres
      PGPASSWORD: postgres123

    ports:
      - "5001:5000"

    depends_on:
      - postgres


  frontend:
    build: ./frontend
    container_name: machhmarwa-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data:
